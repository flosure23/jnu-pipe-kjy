name: Train ML Model

on:
  push:
    branches: [ "main" ]
    paths:
      - "SpamCheck/ml/**"
      - "SpamCheck/app/**"
      - "SpamCheck/tests/**"
      - "SpamCheck/requirements.txt"
      - ".github/workflows/train.yml"

  workflow_dispatch:

jobs:
  train:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./SpamCheck

    env:
      MODEL_MODE: mlflow
      MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
      MLFLOW_EXPERIMENT_NAME: spam-classification-server
      MLFLOW_REGISTERED_MODEL_NAME: spam-model
      MLFLOW_MODEL_ALIAS: champion
      MODEL_URI: models:/spam-model@champion
      PYTHONUTF8: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: |
          MODEL_MODE=rules pytest -q

      - name: Check MLflow tracking server
        run: |
          if [ -z "$MLFLOW_TRACKING_URI" ]; then
            echo "::error::MLFLOW_TRACKING_URI repository secret is required"
            exit 1
          fi
          python -c "import os, urllib.parse; uri=os.environ['MLFLOW_TRACKING_URI']; parsed=urllib.parse.urlparse(uri); print(f'MLFLOW_TRACKING_URI host={parsed.netloc}')"

      - name: Train model
        run: |
          python -m ml.train

      - name: Upload trained artifacts
        uses: actions/upload-artifact@v4
        with:
          name: trained-model-files
          path: SpamCheck/ml/artifacts/
