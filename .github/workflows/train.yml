name: Train ML Model

on:
  push:
    branches: [ "main" ]
    paths:
      - 'SpamCheck/ml/**'
      - 'SpamCheck/app/**'
      - 'SpamCheck/tests/**'
      - 'SpamCheck/requirements.txt'
      - '.github/workflows/train.yml'
  workflow_dispatch: # GitHub 웹 화면에서 수동으로 실행 가능하게 하는 옵션

jobs:
  train:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./SpamCheck # 코드가 SpamCheck 폴더 안에 있으므로 설정

    steps:
      - name: 코드 가져오기
        uses: actions/checkout@v4

      - name: 파이썬 설치
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 라이브러리 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 테스트 실행
        run: |
          pytest -q

      - name: 모델 학습 실행
        env:
          # GitHub Secrets에 NGROK URL을 등록해두면 더 안전하지만, 실습을 위해 직접 하드코딩된 config.py를 사용하거나 환경변수로 덮어씌울 수 있습니다.
          MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }} 
        run: |
          python -m ml.train

      - name: 학습 결과(Artifacts) 업로드
        uses: actions/upload-artifact@v4
        with:
          name: trained-model-files
          path: SpamCheck/ml/artifacts/