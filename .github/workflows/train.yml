name: Train ML Model

on:
  push:
    branches: [ "main" ]
    paths:
      - "SpamCheck/ml/**"
      - "SpamCheck/app/**"
      - "SpamCheck/tests/**"
      - "SpamCheck/requirements.txt"
      - ".github/workflows/train.yml"
  workflow_dispatch:

jobs:
  train:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./SpamCheck

    env:
      MODEL_MODE: mlflow
      MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
      MLFLOW_EXPERIMENT_NAME: spam-classification-server
      MLFLOW_REGISTERED_MODEL_NAME: spam-model
      MLFLOW_MODEL_ALIAS: champion
      MODEL_URI: models:/spam-model@champion
      PYTHONUTF8: "1"

    steps:
      - name: 코드 가져오기
        uses: actions/checkout@v4

      - name: 파이썬 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 라이브러리 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 테스트 실행
        run: |
          MODEL_MODE=rules pytest -q

      - name: MLflow 서버 설정 확인
        run: |
          if [ -z "$MLFLOW_TRACKING_URI" ]; then
            echo "::error::MLFLOW_TRACKING_URI repository secret is required"
            exit 1
          fi

      - name: 모델 학습 실행
        run: |
          python -m ml.train

      - name: 학습 결과 업로드
        uses: actions/upload-artifact@v4
        with:
          name: trained-model-files
          path: SpamCheck/ml/artifacts/
