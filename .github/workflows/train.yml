name: Train ML Model

on:
  push:
    branches: [ "main" ]
    paths:
      - "SpamCheck/ml/**"
      - "SpamCheck/app/**"
      - "SpamCheck/tests/**"
      - "SpamCheck/requirements.txt"
      - ".github/workflows/train.yml"
  workflow_dispatch:

jobs:
  train:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./SpamCheck

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: |
          pytest -q

      - name: Train model
        run: |
          python -m ml.train

      - name: Upload trained artifacts
        uses: actions/upload-artifact@v4
        with:
          name: trained-model-files
          path: SpamCheck/ml/artifacts/
